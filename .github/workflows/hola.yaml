name: Hola Actions
on: push
permissions:
  contents: read
jobs:
  saludar:
    runs-on: ubuntu-latest
    steps:
      - name: Preparar Node.js 
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: saludar
        run: echo "Hola desde Github Actions"
      - name: Consultar versión
        run: node --version
